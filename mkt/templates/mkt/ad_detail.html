{% extends "base_menu.html" %}
{% load humanize %} <!-- https://docs.djangoproject.com/en/5.2/ref/contrib/humanize -->
{% block content %}
<span style="float: right;">
({{ ad.updated_at|naturaltime }})
{% if ad.owner == user %}
<a href="{% url 'mkt:ad_update' ad.id %}"><i class="fa fa-pencil"></i></a>
<a href="{% url 'mkt:ad_delete' ad.id %}"><i class="fa fa-trash"></i></a>
{% endif %}
</span>
<h1>{{ ad.title }}</h1>
<p>
{{ ad.text }}

</p>

<!-- Do I need ad price in here? -->
<p>
<strong>Price:</strong> {{ ad.price }}
</p>

<p>
<a href="{% url 'mkt:all' %}">All Advertisements</a>
</p>
{% endblock %}
